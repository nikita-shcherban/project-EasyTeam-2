components:
  schemas:
    # -------------------------
    # GOOD
    # -------------------------
    Good:
      type: object
      properties:
        _id:
          type: string
          example: 673a12345678901234567890
        name:
          type: string
          example: Men's T-shirt
        category:
          $ref: '#/components/schemas/Category'
        image:
          type: string
          example: https://example.com/image.jpg
        price:
          type: object
          required:
            - value
          properties:
            value:
              type: number
              minimum: 0
              example: 1200
            currency:
              type: string
              default: грн
              example: грн
        size:
          type: array
          items:
            type: string
            enum: [XXS, XS, S, M, L, XL, XXL]
          example: [S, M, L, XL]
        description:
          type: string
          example: Comfortable cotton T-shirt
        prevDescription:
          type: string
          example: Previous product description
        gender:
          type: string
          enum: [man, women, unisex]
          example: men
        characteristics:
          type: array
          items:
            type: string
          example: [Cotton, Oversize]
        rating:
          type: number
          description: Середня оцінка за відгуками (0, якщо відгуків немає). Повертається у списку товарів.
          example: 4.5
        feedbacksCount:
          type: integer
          description: Кількість відгуків. Повертається у списку товарів.
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # -------------------------
    # CATEGORY
    # -------------------------
    Category:
      type: object
      properties:
        _id:
          type: string
          example: 673a12345678901234567891
        name:
          type: string
          example: T-shirts

    # -------------------------
    # FEEDBACK
    # -------------------------
    Feedback:
      type: object
      required:
        - _id
        - good
        - rating
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: 673a12345678901234567892
        good:
          type: string
          description: ID товару
          example: 673a12345678901234567890
        author:
          type: string
          description: ID автора відгуку
          example: 673a12345678901234567893
        authorName:
          type: string
          description: Ім'я автора (для гостей)
          example: Nikita
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          minLength: 5
          maxLength: 500
          example: Very good product!
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateFeedbackRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          minLength: 5
          maxLength: 500
          example: Чудовий товар!
        authorName:
          type: string
          minLength: 2
          maxLength: 32
          example: Nikita
          description: Required for unauthenticated users.
    # -------------------------
    # ORDER ITEM
    # -------------------------
    OrderItem:
      type: object
      properties:
        goodId:
          type: string
          example: 665f12345678901234567890
        name:
          type: string
          example: T-shirt
        size:
          type: string
          enum: [XXS, XS, S, M, L, XL, XXL]
        quantity:
          type: integer
          example: 2
        price:
          type: number
          example: 500

    # -------------------------
    # ORDER
    # -------------------------
    Order:
      type: object
      required:
        - firstName
        - lastName
        - phone
        - city
        - novaPoshtaBranch
        - items
        - totalPrice
      properties:
        _id:
          type: string
          example: 673a12345678901234567894
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ivan
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ivanov
        phone:
          type: string
          pattern: '^\+380\d{9}$'
          example: '+380991234567'
        city:
          type: string
          maxLength: 100
          example: Kyiv
        novaPoshtaBranch:
          type: string
          maxLength: 50
          example: 'Branch 12'
        comment:
          type: string
          maxLength: 500
          default: ''
          example: Please call before delivery
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryPrice:
          type: number
          minimum: 0
          default: 0
          example: 0
        totalPrice:
          type: number
          minimum: 0
          example: 2400
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
          default: pending
          example: pending
        userId:
          type: string
          nullable: true
          description: ID користувача або null для гостевого замовлення
          example: 673a12345678901234567893
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
          example: processing
    # -------------------------
    # SESSION
    # -------------------------
    Session:
      type: object
      required:
        - userId
        - accessToken
        - refreshToken
        - accessTokenValidUntil
        - refreshTokenValidUntil
      properties:
        _id:
          type: string
        userId:
          type: string
        accessToken:
          type: string
          writeOnly: true
        refreshToken:
          type: string
          writeOnly: true
        accessTokenValidUntil:
          type: string
          format: date-time
        refreshTokenValidUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    # -------------------------
    # SUBSCRIPTION
    # -------------------------
    Subscription:
      type: object
      required:
        - _id
        - email
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: 672a1b2c3d4e5f6789012345
        email:
          type: string
          format: email
          example: user@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSubscriptionRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
          description: Адреса електронної пошти

    SubscriptionResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Підписку успішно оформлено
        data:
          $ref: '#/components/schemas/Subscription'
    # -------------------------
    # USER
    # -------------------------
    User:
      type: object
      required:
        - username
        - phone
        - role
      properties:
        _id:
          type: string
          example: 673a12345678901234567893
        username:
          type: string
          minLength: 2
          maxLength: 32
          example: ivan123
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Ivan
        surname:
          type: string
          minLength: 2
          maxLength: 32
          example: Ivanov
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          example: '+380991234567'
        city:
          type: string
          maxLength: 50
          example: Kyiv
        role:
          type: string
          enum: [User, Administrator]
          default: User
          example: User
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
          example: TestUser
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Ivan
        surname:
          type: string
          minLength: 2
          maxLength: 32
          example: Petrenko
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          pattern: '^\+380\d{9}$'
          example: '+380991234567'
        city:
          type: string
          maxLength: 50
          example: Kyiv
    # -------------------------
    # PAGINATION
    # -------------------------
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalCount:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 9
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

    RegisterRequest:
      type: object
      required:
        - username
        - phone
        - password
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
          example: TestUser
        phone:
          type: string
          pattern: '^\+380\d{9}$'
          example: '+380991234567'
        password:
          type: string
          format: password
          minLength: 8
          example: Password123
    LoginRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          pattern: '^\+380\d{9}$'
          example: '+380991234567'
        password:
          type: string
          format: password
          minLength: 8
          example: Password123

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Session refreshed
    OrderItemRequest:
      type: object
      required:
        - goodId
        - size
        - quantity
      properties:
        goodId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 665f12345678901234567890
        size:
          type: string
          enum: [XXS, XS, S, M, L, XL, XXL]
          example: M
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2

    CreateOrderRequest:
      type: object
      required:
        - firstName
        - lastName
        - phone
        - city
        - novaPoshtaBranch
        - items
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ivan
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: Petrenko
        phone:
          type: string
          pattern: '^\+380\d{9}$'
          example: '+380991234567'
        city:
          type: string
          maxLength: 100
          example: Kyiv
        novaPoshtaBranch:
          type: string
          maxLength: 50
          example: '12'
        comment:
          type: string
          maxLength: 500
          example: Please call before delivery
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    UserOrdersResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: User orders retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
